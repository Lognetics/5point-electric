# Replace repo and base_url before going live. See README, "Connecting the CMS".
backend:
  name: github
  repo: Lognetics/5point-electric
  branch: main
  base_url: https://www.5pointselectric.com
  auth_endpoint: api/cms/auth

# Lets `npm run cms` edit local files during development.
local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:

  - name: cars
    label: Cars for sale
    label_singular: Car
    folder: content/cars
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} ({{powertrain}})"
    fields:
      - { name: title, label: Full name, hint: "For example 2026 Geely EX5", widget: string }
      - { name: make, label: Make, widget: string }
      - { name: model, label: Model, widget: string }
      - { name: year, label: Year, widget: number, value_type: int }
      - { name: headline, label: Short type line, hint: "For example Fully Electric SUV", widget: string }
      - name: powertrain
        label: Category
        widget: select
        options:
          - { label: Fully Electric, value: electric }
          - { label: Plug-In Hybrid, value: hybrid }
      - name: bodyType
        label: Body type
        widget: select
        options:
          - { label: SUV, value: suv }
          - { label: Hatchback, value: hatchback }
          - { label: Shooting Brake, value: shooting-brake }
          - { label: Pickup, value: pickup }
          - { label: Sedan, value: sedan }
      - { name: price, label: Price in naira, hint: "Numbers only. Leave empty to show Price on request.", widget: number, value_type: int, required: false }
      - { name: summary, label: Short description, widget: text }
      - name: highlights
        label: Key figures (first three show on the car card)
        widget: list
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      - name: specifications
        label: Specifications
        widget: list
        fields:
          - { name: label, label: Specification, widget: string }
          - { name: value, label: Value, widget: string }
      - { name: availability, label: Availability note, widget: string, required: false }
      - name: images
        label: Photos (the first is the cover)
        widget: list
        min: 1
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: alt, label: Photo description (alt text), widget: string }
      - { name: featured, label: Feature on the home page, widget: boolean, default: false, required: false }
      - { name: order, label: Display order, widget: number, value_type: int, default: 100, required: false }
  - name: products
    label: Products
    label_singular: Product
    folder: content/products
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    fields:
      - { name: title, label: Product name, widget: string }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Electric Vehicles, value: electric-vehicles }
          - { label: EV Charging Equipment, value: ev-charging-equipment }
          - { label: AC Electrical Cables, value: ac-cables }
          - { label: DC Electrical Cables, value: dc-cables }
          - { label: Solar Panels, value: solar-panels }
          - { label: Solar Inverters, value: solar-inverters }
          - { label: Battery Energy Storage Systems, value: battery-storage }
          - { label: Industrial Solar Components, value: industrial-solar-components }
      - { name: summary, label: Short description, widget: text }
      - { name: description, label: Full description, widget: text, required: false }
      - { name: image, label: Product image, widget: image }
      - { name: imageAlt, label: Image description (alt text), widget: string }
      - name: specifications
        label: Technical specifications
        hint: Only publish verified specifications.
        widget: list
        required: false
        fields:
          - { name: label, label: Specification, widget: string }
          - { name: value, label: Value, widget: string }
      - { name: applications, label: Application areas, widget: list, required: false }
      - { name: sample, label: Sample content (labelled and hidden from search), widget: boolean, default: false, required: false }
      - { name: order, label: Display order, widget: number, value_type: int, default: 100, required: false }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} ({{location}})"
    fields:
      - { name: title, label: Project title, widget: string }
      - name: category
        label: Project category
        widget: select
        options:
          - { label: EV Charging Infrastructure, value: ev-charging }
          - { label: Solar Energy Installations, value: solar-installations }
          - { label: Industrial Energy Systems, value: industrial-energy }
          - { label: Electrical Infrastructure, value: electrical-infrastructure }
      - { name: location, label: Location, widget: string }
      - { name: summary, label: Short summary, widget: text }
      - { name: description, label: Project description, widget: text }
      - name: images
        label: Images
        widget: list
        min: 1
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Image description (alt text), widget: string }
          - { name: position, label: "Focal point when cropped (optional, e.g. 50% 40%)", widget: string, required: false }
      - name: videos
        label: Videos
        hint: Short silent clips (MP4). They loop without sound. Add a still image from the clip as its poster.
        widget: list
        required: false
        fields:
          - { name: src, label: Video (MP4), widget: file, media_folder: /public/videos, public_folder: /videos }
          - { name: poster, label: Poster image, widget: image }
          - { name: alt, label: What the video shows, widget: string }
      - name: technicalDetails
        label: Technical details
        hint: Only publish verified details.
        widget: list
        required: false
        fields:
          - { name: label, label: Detail, widget: string }
          - { name: value, label: Value, widget: string }
      - { name: sample, label: Sample content (labelled and hidden from search), widget: boolean, default: false, required: false }
      - { name: order, label: Display order, widget: number, value_type: int, default: 100, required: false }

  - name: site
    label: Company information
    delete: false
    editor: { preview: false }
    files:
      - name: settings
        label: Contact details and settings
        file: content/settings.json
        fields:
          - { name: companyName, label: Company name, widget: string }
          - { name: shortName, label: Short name, widget: string }
          - { name: description, label: Short company description, widget: text }
          - { name: brandMessage, label: Brand message, widget: string }
          - { name: address, label: Office address, widget: text }
          - { name: locations, label: Operational locations, widget: list }
          - { name: mapQuery, label: Google Maps search text, widget: string }
          - { name: phone, label: Phone number, widget: string, required: false }
          - { name: email, label: Email address, widget: string, required: false }
          - { name: whatsappNumber, label: WhatsApp number with country code, hint: "For example 234 followed by the number. The WhatsApp button appears once this is set.", widget: string, required: false }
          - { name: whatsappMessage, label: WhatsApp starter message, widget: string, required: false }
          - name: socials
            label: Social media links
            widget: object
            fields:
              - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
              - { name: x, label: X URL, widget: string, required: false }
              - { name: facebook, label: Facebook URL, widget: string, required: false }
              - { name: instagram, label: Instagram URL, widget: string, required: false }
          - { name: showSampleContent, label: Show labelled sample products and projects, hint: "Turn off before launch or once real content is added.", widget: boolean, required: false }
      - name: hero
        label: Home page hero slider
        file: content/hero.json
        fields:
          - { name: interval, label: Seconds per slide, widget: number, value_type: int, default: 7 }
          - name: slides
            label: Slides
            hint: The first slide's title is the page's main heading.
            widget: list
            fields:
              - { name: tab, label: Short label for the slide tab, widget: string }
              - { name: eyebrow, label: Small line above the title, widget: string, required: false }
              - { name: title, label: Title, widget: string }
              - { name: text, label: Supporting text, hint: Leave empty on a car slide to use the car's short description., widget: text, required: false }
              - { name: car, label: Car file name (optional), hint: "For example xiaomi-yu7-max. Shows that car's price and key figures.", widget: string, required: false }
              - name: image
                label: Image
                widget: object
                fields:
                  - { name: src, label: Image, widget: image }
                  - { name: alt, label: Image description (alt text), widget: string }
                  - { name: demo, label: Demonstration image (not a 5Points photo), widget: boolean, required: false }
              - name: mobileImage
                label: Phone image (optional)
                hint: A portrait photo for phones. Leave empty to use the main image.
                widget: object
                required: false
                fields:
                  - { name: src, label: Image, widget: image }
                  - { name: alt, label: Image description (alt text), widget: string }
                  - { name: demo, label: Demonstration image (not a 5Points photo), widget: boolean, required: false }
              - { name: position, label: Focal point, hint: "Which part of the photo to keep in view, as horizontal then vertical percentages, e.g. 50% 60%", widget: string, required: false }
              - name: primary
                label: Main button
                widget: object
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Link, widget: string }
              - name: secondary
                label: Second button
                widget: object
                required: false
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Link, widget: string }
      - name: company
        label: About the company
        file: content/company.json
        fields:
          - { name: whoWeAre, label: Who we are, widget: text }
          - { name: vision, label: Vision, widget: text }
          - { name: mission, label: Mission, widget: text }
          - name: values
            label: Core values
            widget: list
            fields:
              - { name: title, label: Value, widget: string }
              - { name: description, label: Description, widget: text }
          - { name: commitment, label: Our commitment, widget: text }
      - name: promo
        label: Promotion (banner and popup)
        file: content/promo.json
        fields:
          - { name: enabled, label: Show the promotion, widget: boolean, default: false }
          - { name: popup, label: Also show a popup when visitors arrive, widget: boolean, default: true }
          - { name: endsAt, label: Ends at (hidden automatically after this), widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", picker_utc: false }
          - { name: endsLabel, label: End date as shown on the site, widget: string, hint: "e.g. Friday 27 November 2026" }
          - { name: eyebrow, label: Badge text, widget: string }
          - { name: title, label: Headline, widget: string }
          - { name: text, label: Text, widget: text }
          - name: image
            label: Promo artwork
            widget: object
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: "Image description (alt text, include the offer details)", widget: text }
              - { name: demo, label: Demonstration image, widget: boolean, default: false, required: false }
          - name: primary
            label: Main button
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - name: secondary
            label: Second button
            widget: object
            required: false
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - { name: phones, label: Call or WhatsApp numbers, widget: list, field: { name: phone, label: Phone, widget: string }, required: false }
      - name: images
        label: Website images
        file: content/images.json
        fields:
          - name: hero
            label: "Home: hero"
            widget: object
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: Image description (alt text), widget: string }
              - { name: demo, label: Demonstration image (not a 5Points photo), widget: boolean, required: false }
              - { name: position, label: "Focal point when cropped (optional, e.g. 50% 40%)", widget: string, required: false }
          - name: intro
            label: "Home: company introduction"
            widget: object
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: Image description (alt text), widget: string }
              - { name: demo, label: Demonstration image (not a 5Points photo), widget: boolean, required: false }
              - { name: position, label: "Focal point when cropped (optional, e.g. 50% 40%)", widget: string, required: false }
          - name: introSecondary
            label: "Home: company introduction (second image)"
            widget: object
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: Image description (alt text), widget: string }
              - { name: demo, label: Demonstration image (not a 5Points photo), widget: boolean, required: false }
              - { name: position, label: "Focal point when cropped (optional, e.g. 50% 40%)", widget: string, required: false }
          - name: electricVehicles
            label: "Electric vehicles"
            widget: object
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: Image description (alt text), widget: string }
              - { name: demo, label: Demonstration image (not a 5Points photo), widget: boolean, required: false }
              - { name: position, label: "Focal point when cropped (optional, e.g. 50% 40%)", widget: string, required: false }
          - name: solarCharging
